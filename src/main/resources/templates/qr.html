<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head th:replace="~{fragments/layout :: head('QR đặt món')}"></head><body data-live=""><a class="skip-link" href="#main-content">Đi đến nội dung chính</a><main class="print-card" id="main-content" tabindex="-1"><div class="brand justify-content-center"><span class="brand-mark">U</span>UTETaste</div><p class="eyebrow mt-4" th:text="${table.branch.name}"></p><h1 th:text="${table.label}"></h1><img class="qr-image" th:src="@{/staff/tables/{id}/qr.png(id=${table.id})}" alt="Mã QR để gọi món tại bàn"><h2>Quét mã. Chọn món. Thưởng thức.</h2><p>Mở camera điện thoại và quét mã để bắt đầu.</p><a th:href="${tableUrl}" class="qr-link no-print">Mở thực đơn của bàn này →</a><div class="no-print mt-4"><div class="button-actions"><button class="btn btn-primary" data-print>In mã QR</button><a th:href="@{/staff/tables(branchId=${table.branch.id})}" class="btn btn-light">Quay lại</a></div><form sec:authorize="hasAnyRole('ADMIN','MANAGER')" th:action="@{/staff/tables/{id}/rotate(id=${table.id})}" method="post" class="mt-3" data-admin-confirm="QR cũ sẽ hết hiệu lực ngay. Bạn cần in và thay toàn bộ QR cũ. Chỉ đổi được khi bàn không có khách. Tiếp tục?"><button class="btn btn-link text-muted">Đổi mã QR của bàn</button></form></div></main><div th:replace="~{fragments/layout :: scripts}"></div><script src="/js/admin.js"></script></body></html>
