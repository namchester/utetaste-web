<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head th:replace="~{fragments/layout :: head('Nhật ký hoạt động')}"></head><body data-live="staff"><a class="skip-link" href="#main-content">Đi đến nội dung chính</a><aside th:replace="~{fragments/layout :: sidebar}"></aside><div class="workspace"><header th:replace="~{fragments/layout :: topbar}"></header><main class="page-content" id="main-content" tabindex="-1"><div th:replace="~{fragments/layout :: flash}"></div><div class="page-heading"><div><h1>Nhật ký hoạt động</h1><p>100 thao tác gần nhất trong hệ thống.</p></div></div><section class="panel table-responsive" tabindex="0" role="region" aria-label="Bảng dữ liệu, cuộn ngang để xem thêm"><table class="table align-middle"><thead><tr><th scope="col">Thời gian</th><th scope="col">Tài khoản</th><th scope="col">Thao tác</th><th scope="col">Nội dung</th><th scope="col">Chi nhánh</th></tr></thead><tbody><tr th:each="l:${logs}"><td th:text="${@fmt.time(l.createdAt)}"></td><td th:text="${l.actor}"></td><td><span class="mini-tag" th:text="${l.action}"></span></td><td th:text="${l.detail}"></td><td th:text="${l.branchId ?: 'Toàn chuỗi'}"></td></tr></tbody></table></section></main></div><div th:replace="~{fragments/layout :: scripts}"></div></body></html>
