<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Đăng ký tài khoản')}"></head>
<body><main class="container py-5" style="max-width:600px">
<a class="brand" href="/">UTE Taste</a><section class="panel mt-4">
<h1>Đăng ký tài khoản</h1><p>Tạo tài khoản cá nhân bằng email. Bạn vẫn có thể quét QR tại bàn để gọi món.</p>
<p class="alert alert-danger" th:if="${message}" th:text="${message}" role="alert"></p>
<form th:action="@{/register}" method="post" data-password-confirm>
<label class="form-label" for="fullName">Họ và tên</label><input class="form-control mb-3" id="fullName" name="fullName" maxlength="100" autocomplete="name" required>
<label class="form-label" for="email">Email</label><input class="form-control mb-3" id="email" name="email" type="email" th:value="${email}" maxlength="254" autocomplete="email" required>
<label class="form-label" for="password">Mật khẩu</label><input class="form-control mb-3" id="password" name="password" type="password" minlength="10" maxlength="72" autocomplete="new-password" required aria-describedby="password-help">
<p id="password-help" class="small text-muted">Ít nhất 10 ký tự, tối đa 72 byte UTF-8.</p>
<label class="form-label" for="confirmPassword">Xác nhận mật khẩu</label><input class="form-control mb-3" id="confirmPassword" name="confirmPassword" type="password" minlength="10" maxlength="72" autocomplete="new-password" required>
<button class="btn btn-primary w-100">Đăng ký và nhận OTP</button></form>
<p class="mt-3"><a href="/verify-email">Đã đăng ký? Xác minh hoặc gửi lại mã</a></p><a href="/login">Về đăng nhập</a>
</section></main><script src="/js/account.js" defer></script><div th:replace="~{fragments/layout :: scripts}"></div></body></html>
