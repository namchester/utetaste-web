<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Đặt mật khẩu mới')}"></head>
<body><main class="container py-5" style="max-width:600px"><section class="panel">
<h1>Đặt mật khẩu mới</h1><p>Quyền đặt lại mật khẩu có hạn 5 phút sau khi xác minh OTP và chỉ dùng một lần.</p>
<p class="alert alert-danger" th:if="${message}" th:text="${message}" role="alert"></p>
<form th:action="@{/reset-password}" method="post" data-password-confirm>
<label class="form-label" for="password">Mật khẩu mới</label><input class="form-control mb-3" id="password" name="password" type="password" minlength="10" maxlength="72" autocomplete="new-password" required>
<p class="small text-muted">Ít nhất 10 ký tự, tối đa 72 byte UTF-8.</p>
<label class="form-label" for="confirmPassword">Xác nhận mật khẩu mới</label><input class="form-control mb-3" id="confirmPassword" name="confirmPassword" type="password" minlength="10" maxlength="72" autocomplete="new-password" required>
<button class="btn btn-primary">Lưu mật khẩu mới</button></form><p class="mt-3"><a href="/forgot-password">Yêu cầu OTP mới</a></p>
</section></main><script src="/js/account.js" defer></script><div th:replace="~{fragments/layout :: scripts}"></div></body></html>
