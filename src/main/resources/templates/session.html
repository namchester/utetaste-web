<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head th:replace="~{fragments/layout :: head('Chi tiết bàn')}"></head><body data-live="staff"><a class="skip-link" href="#main-content">Đi đến nội dung chính</a><aside th:replace="~{fragments/layout :: sidebar}"></aside><div class="workspace"><header th:replace="~{fragments/layout :: topbar}"></header><main class="page-content" id="main-content" tabindex="-1"><div th:replace="~{fragments/layout :: flash}"></div><div class="page-heading"><div><span class="eyebrow" th:text="${dining.table.branch.name}"></span><h1 th:text="${dining.table.label}"></h1><p th:text="'Mở lúc '+${@fmt.time(dining.openedAt)}"></p></div><a th:href="@{/staff/tables(branchId=${dining.table.branch.id})}" class="btn btn-outline-dark">← Về danh sách bàn</a></div><div class="checkout-layout"><section data-live-zone id="session-orders"><div class="order-grid single"><th:block th:each="o:${orders}"><div th:replace="~{fragments/layout :: orderCard(${o})}"></div></th:block></div><div class="empty-state" th:if="${#lists.isEmpty(orders)}">Bàn chưa gọi món.</div></section><aside class="panel checkout-panel"><h2>Thanh toán tại quầy</h2><div class="cart-total" data-live-zone id="session-total"><span>Tạm tính</span><strong th:text="${@fmt.money(total)}"></strong></div><p class="small text-muted">Chỉ xác nhận khi đã nhận đủ tiền và tất cả món đã phục vụ. Đơn hủy không tính tiền.</p><form th:if="${dining.open}" th:action="@{/staff/sessions/{id}/checkout(id=${dining.id})}" method="post" data-confirm="Bạn đã kiểm tra hóa đơn và nhận đủ tiền của khách?"><label class="form-label" for="method">Phương thức</label><select class="form-select" name="method" id="method"><option value="CASH">Tiền mặt</option><option value="BANK_TRANSFER">Chuyển khoản đã xác nhận</option></select><label class="form-label mt-3" for="discount">Giảm giá (%)</label><input class="form-control" name="discountPercent" id="discount" type="number" value="0" min="0" max="30" th:readonly="${actor.role.name() == 'WAITER'}"><small class="text-muted">Chỉ quản lý được áp dụng giảm giá.</small><button class="btn btn-primary w-100 mt-4">Xác nhận đã thu tiền</button></form><a th:if="${invoice != null}" th:href="@{/staff/receipt/{id}(id=${invoice.id})}" class="btn btn-primary w-100">Xem hóa đơn đã thanh toán</a><form th:if="${dining.open}" th:action="@{/staff/sessions/{id}/close(id=${dining.id})}" method="post" data-confirm="Đóng phiên bàn không có món tính tiền?"><button class="btn btn-link text-muted w-100 mt-2">Đóng bàn trống / đã hủy hết</button></form></aside></div></main></div><div th:replace="~{fragments/layout :: scripts}"></div></body></html>
