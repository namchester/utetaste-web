<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head th:replace="~{fragments/layout :: head('Hóa đơn')}"></head><body data-live=""><a class="skip-link" href="#main-content">Đi đến nội dung chính</a><main class="receipt" id="main-content" tabindex="-1"><div class="brand justify-content-center"><span class="brand-mark">U</span>UTETaste</div><p class="text-center mt-3" th:text="${invoice.session.table.branch.name}"></p><p class="small text-center" th:text="${invoice.session.table.branch.address}"></p><h1>HÓA ĐƠN THANH TOÁN</h1><div class="receipt-meta"><span th:text="${invoice.code}"></span><strong th:text="${invoice.session.table.label}"></strong></div><p class="small" th:text="${@fmt.time(invoice.paidAt)}"></p><table class="table"><thead><tr><th scope="col">Món</th><th scope="col">SL</th><th scope="col">Thành tiền</th></tr></thead><tbody th:each="o:${orders}"><tr th:each="i:${o.items}"><td><span th:text="${i.name}"></span><small class="d-block text-muted" th:text="${@fmt.money(i.price)}"></small></td><td th:text="${i.quantity}"></td><td th:text="${@fmt.money(i.total)}"></td></tr></tbody></table><div class="receipt-line"><span>Tạm tính</span><span th:text="${@fmt.money(invoice.subtotal)}"></span></div><div class="receipt-line"><span>Giảm giá</span><span th:text="${@fmt.money(invoice.discountAmount)}"></span></div><div class="receipt-line grand"><span>Đã thanh toán</span><strong th:text="${@fmt.money(invoice.total)}"></strong></div><p class="small" th:text="${@fmt.method(invoice.method)}"></p><p class="small" th:text="'Thu ngân: '+${invoice.cashier}"></p><hr><p class="text-center">Cảm ơn bạn. Hẹn gặp lại tại UTETaste!</p><p class="small text-muted text-center">Phiếu thanh toán nội bộ · Không phải hóa đơn điện tử thuế</p><div class="no-print d-flex gap-2"><button class="btn btn-primary flex-grow-1" data-print>In hóa đơn</button><a th:href="@{/staff/tables(branchId=${invoice.session.table.branch.id})}" class="btn btn-light">Về bàn</a></div></main><div th:replace="~{fragments/layout :: scripts}"></div></body></html>
