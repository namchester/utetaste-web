<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head th:replace="~{fragments/layout :: head('Đổi mật khẩu')}"></head><body th:class="${actor.role.name() == 'USER' ? 'member-body' : ''}" th:attr="data-live=${actor.role.name() == 'USER' ? '' : 'staff'}"><a class="skip-link" href="#main-content">Đi đến nội dung chính</a><th:block th:if="${actor.role.name() != 'USER'}"><aside th:replace="~{fragments/layout :: sidebar}"></aside></th:block><div th:class="${actor.role.name() == 'USER' ? 'member-shell' : 'workspace'}"><th:block th:if="${actor.role.name() == 'USER'}"><aside th:replace="~{fragments/member :: navigation}"></aside></th:block><th:block th:if="${actor.role.name() != 'USER'}"><header th:replace="~{fragments/layout :: topbar}"></header></th:block><main th:class="${actor.role.name() == 'USER' ? 'member-main' : 'page-content'}" id="main-content" tabindex="-1"><div th:replace="~{fragments/layout :: flash}"></div><div class="page-heading"><div><h1>Đổi mật khẩu</h1><p>Sau khi đổi, các phiên đăng nhập hiện tại sẽ kết thúc.</p></div><a href="/account" class="btn btn-outline-dark">← Tài khoản cá nhân</a></div><form class="panel form-narrow" th:action="@{/account/password}" method="post"><label for="oldPassword" class="form-label">Mật khẩu hiện tại</label><input type="password" class="form-control" id="oldPassword" name="oldPassword" maxlength="72" autocomplete="current-password" required><label for="newPassword" class="form-label mt-3">Mật khẩu mới</label><input type="password" class="form-control" id="newPassword" name="newPassword" minlength="10" maxlength="72" autocomplete="new-password" required><p class="small text-muted mt-2">Ít nhất 10 ký tự, tối đa 72 byte.</p><button class="btn btn-primary mt-3">Lưu mật khẩu mới</button></form></main></div><div th:replace="~{fragments/layout :: scripts}"></div></body></html>
