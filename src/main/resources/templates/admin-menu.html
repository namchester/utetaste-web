<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head th:replace="~{fragments/layout :: head('Thực đơn chung')}"></head><body data-live="staff"><a class="skip-link" href="#main-content">Đi đến nội dung chính</a><aside th:replace="~{fragments/layout :: sidebar}"></aside><div class="workspace"><header th:replace="~{fragments/layout :: topbar}"></header><main class="page-content" id="main-content" tabindex="-1"><div th:replace="~{fragments/layout :: flash}"></div><div class="page-heading"><div><span class="eyebrow">MÓN NGON LÀ TRUNG TÂM</span><h1>Thực đơn chung</h1><p>Quản lý món, giá bán, danh mục và hình ảnh.</p></div></div><form th:replace="~{fragments/admin-catalog :: filters}"></form><div class="admin-grid wide catalog-grid"><section th:replace="~{fragments/admin-catalog :: listing}"></section><section class="panel"><h2 th:text="${editing?.id == null ? 'Thêm món ăn' : 'Chỉnh sửa món'}"></h2><form th:action="@{/admin/menu}" method="post" th:attr="data-admin-confirm=${editing != null ? 'Lưu thay đổi món? Giá mới áp dụng cho lượt gọi mới, lịch sử đơn giữ nguyên.' : null}"><input type="hidden" name="id" th:value="${editing?.id}"><label class="form-label" for="dish-name">Tên món</label><input class="form-control" id="dish-name" name="name" th:value="${editing?.name}" maxlength="120" required><label class="form-label mt-3" for="price">Giá bán (VND)</label><input class="form-control" id="price" name="price" type="number" min="1" max="10000000" step="1" th:value="${editing?.price}" required><label class="form-label mt-3" for="category">Danh mục</label><select class="form-select" id="category" name="categoryId" required><option th:each="c:${categories}" th:value="${c.id}" th:text="${c.name}" th:selected="${editing != null and editing.category.id == c.id}"></option></select><label class="form-label mt-3" for="description">Mô tả</label><textarea class="form-control" id="description" name="description" rows="3" maxlength="1000" th:text="${editing?.description}" required></textarea><label class="form-check mt-3"><input class="form-check-input" type="checkbox" name="active" value="true" th:checked="${editing == null or editing.active}"> Đang bán toàn chuỗi</label><div class="d-flex gap-2 mt-3"><button class="btn btn-primary">Lưu món</button><a class="btn btn-light" href="/admin/menu">Tạo mới</a></div></form><div th:if="${editing?.id != null}" class="mt-4 border-top pt-3"><h3>Ảnh món ăn</h3><img class="img-fluid rounded mb-3" style="max-height:200px" th:with="photoUrl=${@fmt.image(editing.imageUrl)}" th:src="${photoUrl}" th:alt="${editing.name}"><p class="small text-muted">JPG, PNG hoặc WebP · tối đa 5 MB, 16 triệu pixel</p><div class="alert alert-warning small" th:if="${!cloudReady}" role="status">Cloudinary chưa được cấu hình. Ảnh mẫu vẫn hoạt động.</div><form th:action="@{/admin/dishes/{id}/image(id=${editing.id})}" method="post" enctype="multipart/form-data"><input class="form-control" type="file" name="image" accept="image/png,image/jpeg,image/webp" data-dish-image aria-label="Chọn ảnh món ăn" required><img id="dish-image-preview" class="img-fluid rounded mt-3" alt="Ảnh món ăn xem trước" hidden><p id="dish-image-status" class="small mt-2" role="status"></p><button class="btn btn-outline-dark mt-2" th:disabled="${!cloudReady}">Tải ảnh lên Cloudinary</button></form></div></section></div><section th:replace="~{fragments/admin-catalog :: categories}"></section></main></div><script src="/js/dish-image.js" defer></script><div th:replace="~{fragments/layout :: scripts}"></div><script src="/js/admin.js" defer></script></body></html>
