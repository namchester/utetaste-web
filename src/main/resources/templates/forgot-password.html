<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Quên mật khẩu')}"></head>
<body><main class="container py-5" style="max-width:600px"><section class="panel">
<h1>Khôi phục mật khẩu</h1><p>Sử dụng email khôi phục đã xác minh. Nhân viên chưa liên kết email cần liên hệ Admin.</p>
<p class="alert alert-success" th:if="${success}" th:text="${success}" role="status"></p>
<p class="alert alert-danger" th:if="${message}" th:text="${message}" role="alert"></p>
<form th:action="@{/forgot-password}" method="post">
<label class="form-label" for="request-email">Email khôi phục</label><input class="form-control mb-3" id="request-email" name="email" type="email" maxlength="254" autocomplete="email" th:value="${email}" required>
<button class="btn btn-primary">Gửi / gửi lại OTP</button><p class="small text-muted mt-2">Chờ ít nhất 60 giây trước khi gửi lại. Kiểm tra cả thư rác.</p></form><hr>
<form th:action="@{/forgot-password/verify}" method="post">
<label class="form-label" for="email">Email đã yêu cầu mã</label><input class="form-control mb-3" id="email" name="email" type="email" maxlength="254" th:value="${email}" required>
<label class="form-label" for="code">Mã OTP 8 chữ số</label><input class="form-control mb-3" id="code" name="code" inputmode="numeric" pattern="[0-9]{8}" minlength="8" maxlength="8" autocomplete="one-time-code" required>
<button class="btn btn-outline-dark">Xác minh OTP</button></form><p class="mt-3"><a href="/login">Về đăng nhập</a></p>
</section></main><div th:replace="~{fragments/layout :: scripts}"></div></body></html>
