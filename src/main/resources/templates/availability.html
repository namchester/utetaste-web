<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head th:replace="~{fragments/layout :: head('Món theo chi nhánh')}"></head><body data-live="staff"><a class="skip-link" href="#main-content">Đi đến nội dung chính</a><aside th:replace="~{fragments/layout :: sidebar}"></aside><div class="workspace"><header th:replace="~{fragments/layout :: topbar}"></header><main class="page-content" id="main-content" tabindex="-1"><div th:replace="~{fragments/layout :: flash}"></div><div class="page-heading"><div><span class="eyebrow">THỰC ĐƠN LUÔN SẴN SÀNG</span><h1>Món theo chi nhánh</h1><p>Bật hoặc tạm hết món riêng cho từng chi nhánh.</p></div><form th:replace="~{fragments/layout :: branchPicker}"></form></div><section class="panel"><div class="table-responsive" tabindex="0" role="region" aria-label="Bảng dữ liệu, cuộn ngang để xem thêm"><table class="table align-middle"><thead><tr><th scope="col">Món ăn</th><th scope="col">Danh mục</th><th scope="col">Đơn giá</th><th scope="col">Trạng thái</th><th scope="col">Thao tác</th></tr></thead><tbody><tr th:each="bd:${menu}"><td><div class="dish-cell"><img th:with="photoUrl=${@fmt.image(bd.dish.imageUrl)}" th:src="${photoUrl}" alt=""><strong th:text="${bd.dish.name}"></strong></div></td><td th:text="${bd.dish.category.name}"></td><td th:text="${@fmt.money(bd.dish.price)}"></td><td><span th:text="${!bd.dish.active ? 'Ngừng bán toàn chuỗi' : (bd.available ? 'Đang phục vụ' : 'Tạm hết')}" class="mini-tag"></span></td><td><form th:action="@{/staff/menu/{id}/availability(id=${bd.dish.id})}" method="post"><input type="hidden" name="branchId" th:value="${branchId}"><input type="hidden" name="available" th:value="${!bd.available}"><button class="btn btn-sm btn-outline-dark" th:text="${bd.available ? 'Đánh dấu hết món' : 'Mở bán lại'}"></button></form></td></tr></tbody></table></div></section></main></div><div th:replace="~{fragments/layout :: scripts}"></div></body></html>
