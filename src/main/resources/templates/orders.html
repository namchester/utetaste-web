<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head th:replace="~{fragments/layout :: head('Đơn và màn hình bếp')}"></head><body data-live="staff"><a class="skip-link" href="#main-content">Đi đến nội dung chính</a><aside th:replace="~{fragments/layout :: sidebar}"></aside><div class="workspace"><header th:replace="~{fragments/layout :: topbar}"></header><main class="page-content" id="main-content" tabindex="-1"><div th:replace="~{fragments/layout :: flash}"></div><div class="page-heading"><div><span class="eyebrow">KẾT NỐI BÀN ĂN VỚI NHÀ BẾP</span><h1 th:text="${kitchen ? 'Màn hình bếp' : 'Đơn tại bàn'}"></h1><p>Mới → Xác nhận → Chế biến → Chờ phục vụ → Hoàn tất</p></div><form th:replace="~{fragments/layout :: branchPicker}"></form></div><div class="status-legend"><span class="status-pill NEW">Chờ xác nhận</span><span class="status-pill CONFIRMED">Đã xác nhận</span><span class="status-pill COOKING">Đang chế biến</span><span class="status-pill READY">Chờ phục vụ</span></div><section data-live-zone id="staff-orders"><div class="order-grid"><th:block th:each="o:${orders}"><div th:replace="~{fragments/layout :: orderCard(${o})}"></div></th:block></div><div th:if="${#lists.isEmpty(orders)}" class="empty-state">♨<br>Chưa có đơn cần xử lý ở chi nhánh này.</div></section></main></div><div th:replace="~{fragments/layout :: scripts}"></div></body></html>
