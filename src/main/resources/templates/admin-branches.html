<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head th:replace="~{fragments/layout :: head('Quản lý chi nhánh')}"></head><body data-live="staff"><a class="skip-link" href="#main-content">Đi đến nội dung chính</a><aside th:replace="~{fragments/layout :: sidebar}"></aside><div class="workspace"><header th:replace="~{fragments/layout :: topbar}"></header><main class="page-content" id="main-content" tabindex="-1"><div th:replace="~{fragments/layout :: flash}"></div><div class="page-heading"><div><span class="eyebrow">CÙNG MỘT THƯƠNG HIỆU, NHIỀU ĐIỂM HẸN</span><h1>Chi nhánh</h1><p>Quản lý thông tin và trạng thái phục vụ toàn chuỗi.</p></div></div><div class="admin-grid"><section class="panel"><h2>Danh sách chi nhánh</h2><article class="branch-row" th:each="b:${branches}"><span class="location-icon">⌂</span><div><h3 th:text="${b.name}"></h3><p th:text="${b.address}"></p><small th:text="${b.phone}"></small><span class="mini-tag ms-2" th:text="${b.active ? 'Đang hoạt động' : 'Tạm ngừng'}"></span></div><a class="btn btn-outline-dark btn-sm" th:href="@{/admin/branches(edit=${b.id})}">Sửa</a></article></section><section class="panel"><h2 th:text="${editing == null ? 'Thêm chi nhánh' : 'Sửa chi nhánh'}"></h2><form th:action="@{/admin/branches}" method="post"><input type="hidden" name="id" th:value="${editing?.id}"><label class="form-label" for="branch-name">Tên chi nhánh</label><input class="form-control" id="branch-name" name="name" th:value="${editing?.name}" maxlength="100" required><label class="form-label mt-3" for="address">Địa chỉ</label><input class="form-control" id="address" name="address" th:value="${editing?.address}" maxlength="255" required><label class="form-label mt-3" for="phone">Điện thoại</label><input class="form-control" id="phone" name="phone" th:value="${editing?.phone}" maxlength="20" required><label class="form-check mt-3"><input class="form-check-input" type="checkbox" name="active" value="true" th:checked="${editing == null or editing.active}"> Đang hoạt động</label><div class="d-flex gap-2 mt-4"><button class="btn btn-primary">Lưu chi nhánh</button><a class="btn btn-light" href="/admin/branches">Tạo mới</a></div></form></section></div></main></div><div th:replace="~{fragments/layout :: scripts}"></div></body></html>
