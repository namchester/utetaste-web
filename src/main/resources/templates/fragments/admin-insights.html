<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><body>
<section th:fragment="chart(title,days)" class="panel"><h2 th:text="${title}"></h2><p class="small text-muted">Thực thu sau giảm giá · kết thúc theo ngày lọc</p><div class="table-responsive" tabindex="0" role="region" th:attr="aria-label=${title}"><div class="admin-chart"><div class="chart-day" th:each="day,iter:${days}"><div class="chart-track"><div class="chart-bar" th:style="'height:'+${day.percent}+'%'" th:title="${@fmt.money(day.amount)}"></div></div><span th:if="${#lists.size(days) &lt;= 7 or iter.index % 5 == 0 or iter.last}" th:text="${#temporals.format(day.date,'dd/MM')}"></span><span class="visually-hidden" th:text="${@fmt.money(day.amount)}"></span></div></div><details><summary>Xem số liệu dạng bảng</summary><table class="table"><thead><tr><th scope="col">Ngày</th><th scope="col">Thực thu</th></tr></thead><tbody><tr th:each="day:${days}"><td th:text="${day.date}"></td><td th:text="${@fmt.money(day.amount)}"></td></tr></tbody></table></details></div></section>
<div th:fragment="statusTotals(statuses)" class="d-flex gap-2 flex-wrap mb-3"><span th:each="item:${statuses}" class="mini-tag"><span th:text="${@fmt.status(item.status)}"></span>: <strong th:text="${item.count}"></strong></span></div>
</body></html>
