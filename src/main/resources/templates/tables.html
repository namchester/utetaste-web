<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Bàn và mã QR')}"></head><body data-live="staff">
<a class="skip-link" href="#main-content">Đi đến nội dung chính</a><aside th:replace="~{fragments/layout :: sidebar}"></aside><div class="workspace"><header th:replace="~{fragments/layout :: topbar}"></header>
<main class="page-content" id="main-content" tabindex="-1"><div th:replace="~{fragments/layout :: flash}"></div>
<div class="page-heading"><div><span class="eyebrow">SẮP XẾP CHU ĐÁO, PHỤC VỤ NHẸ NHÀNG</span><h1>Bàn &amp; mã QR</h1><p>Mở bàn để bắt đầu một lượt khách mới.</p></div></div>
<form class="panel admin-filters" method="get"><label for="branchId">Chi nhánh<select class="form-select" id="branchId" name="branchId"><option th:each="b:${branches}" th:value="${b.id}" th:text="${b.name}" th:selected="${b.id == branchId}"></option></select></label>
<label for="table-state">Trạng thái<select id="table-state" name="state" class="form-select"><option value="all">Tất cả</option><option value="occupied" th:selected="${state == 'occupied'}">Đang phục vụ</option><option value="free" th:selected="${state == 'free'}">Sẵn sàng</option><option value="inactive" th:selected="${state == 'inactive'}">Ngừng dùng</option></select></label><button class="btn btn-primary">Lọc bàn</button></form>
<div class="admin-kpis" id="table-stats" data-live-zone><div class="stat-card"><span>Đang phục vụ</span><strong th:text="${stats.occupied}"></strong></div><div class="stat-card"><span>Sẵn sàng</span><strong th:text="${stats.free}"></strong></div><div class="stat-card"><span>Ngừng dùng</span><strong th:text="${stats.inactive}"></strong></div><div class="stat-card"><span>Sử dụng bàn hiện tại</span><strong th:text="${stats.utilization}+'%'"></strong><small>Trên tổng bàn đang hoạt động</small></div></div>
<form id="qr-batch" action="/staff/tables/print" method="get" class="admin-summary"><label><input type="checkbox" class="form-check-input" data-select-tables> Chọn tất cả bàn đang hiển thị</label><button class="btn btn-outline-dark">In QR đã chọn (A4, tối đa 50 bàn)</button></form>
<section id="table-grid" class="table-grid" data-live-zone><article th:each="v:${tables}" class="dining-table" th:classappend="${v.session != null} ? 'occupied'">
<div class="d-flex justify-content-between"><label class="small"><input form="qr-batch" name="ids" type="checkbox" class="form-check-input" th:value="${v.table.id}" th:attr="aria-label='Chọn in QR '+${v.table.label}"> In QR</label><span class="status-pill" th:classappend="${v.session != null} ? 'COOKING' : 'SERVED'" th:text="${!v.table.active ? 'Ngừng dùng' : (v.session != null ? 'Đang phục vụ' : 'Sẵn sàng')}"></span></div>
<h2 th:text="${v.table.label}"></h2><p th:text="${v.table.capacity}+' chỗ ngồi'"></p><strong class="table-amount" th:text="${@fmt.money(v.total)}"></strong><small th:text="${v.orderCount}+' lượt gọi món'"></small>
<small th:if="${v.session != null}" th:text="'Phiên #'+${v.session.id}+' · Mở lúc '+${@fmt.time(v.session.openedAt)}"></small>
<div class="table-actions"><form th:if="${v.session == null and v.table.active and branch.active}" th:action="@{/staff/tables/{id}/open(id=${v.table.id})}" method="post"><button class="btn btn-primary btn-sm">Mở bàn</button></form><a th:if="${v.session != null}" th:href="@{/staff/sessions/{id}(id=${v.session.id})}" class="btn btn-primary btn-sm">Chi tiết / Thu tiền</a><a th:href="@{/staff/tables/{id}/qr(id=${v.table.id})}" class="btn btn-outline-dark btn-sm">Mã QR</a></div>
<details class="mt-3" sec:authorize="hasAnyRole('ADMIN','MANAGER')"><summary class="small">Sửa thông tin bàn</summary><form th:action="@{/staff/tables/save}" method="post" class="mt-2"><input type="hidden" name="id" th:value="${v.table.id}"><input type="hidden" name="branchId" th:value="${branchId}"><label class="form-label small">Tên bàn<input class="form-control form-control-sm" name="label" th:value="${v.table.label}" maxlength="30" required></label><label class="form-label small">Số chỗ<input class="form-control form-control-sm" type="number" name="capacity" th:value="${v.table.capacity}" min="1" max="30" required></label><label class="form-check"><input class="form-check-input" type="checkbox" name="active" value="true" th:checked="${v.table.active}"> Đang hoạt động</label><button class="btn btn-sm btn-dark mt-2">Lưu bàn</button></form></details>
</article><p th:if="${#lists.isEmpty(tables)}" class="panel empty-state">Không có bàn phù hợp bộ lọc.</p></section>
<section class="panel mt-4" sec:authorize="hasAnyRole('ADMIN','MANAGER')"><h2>Thêm bàn mới</h2><form th:action="@{/staff/tables/save}" method="post" class="row g-3"><input type="hidden" name="branchId" th:value="${branchId}"><input type="hidden" name="active" value="true"><div class="col-md-5"><label class="form-label" for="new-table">Tên bàn</label><input class="form-control" id="new-table" name="label" placeholder="Bàn 09" required maxlength="30"></div><div class="col-md-3"><label class="form-label" for="capacity">Số chỗ</label><input class="form-control" id="capacity" name="capacity" type="number" value="4" min="1" max="30" required></div><div class="col-md-4 d-flex align-items-end"><button class="btn btn-primary">+ Thêm bàn</button></div></form></section>
</main></div><div th:replace="~{fragments/layout :: scripts}"></div><script src="/js/admin.js"></script></body></html>
